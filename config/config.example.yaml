
# ==========================================
# H I 21-cm Absorption Pipeline Configuration
# ==========================================

# Input and output directories for images, masks, and logs. These should be absolute paths.
# Replace these paths with your own directories.
paths:
  project_dir: "/path/to/your/project"
  images_dir: "/path/to/your/images"
  masks_dir: "/path/to/your/masks"
  logs_dir: "/path/to/your/logs"
  report_csv: "/path/to/your/report.csv"
  obsids_file: "/path/to/your/obsids.txt"
# Target source information
target:
  name: "GLEAM J0856+0224"
  coordinates: "08:56:14.73 +02:23:59.6"
  redshift: 5.55

post_imaging:
  back_resampling:
    input_file: "/path/to/stack_10kHz.csv"
    output_file: "/path/to/stack_20kHz_covariance.csv"
    original_dir: "/path/to/original_spectra"
    individual_dir: "/path/to/individual_spectra"
    individual_glob: "spectrum_*.csv"
    corrections_file: "/path/to/corrections.csv"

  barycentric_correct:
    obsids_csv: "/path/to/your/obsids.csv"
    output_file: "/path/to/your/corrections.csv"

  boxcar_filtering:
    input_csv: "/path/to/stack_covariance.csv"
    covariance_file: "/path/to/stack_covariance.npz"
    output_file: "/path/to/boxcar_filtered.csv"
    binwidth: 10

  flux_fitting:
    output_dir: "/path/to/spectral_cubes_resample"

  plotting:
    output_dir: "/path/to/final_spectra"
